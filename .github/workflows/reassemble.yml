name: Reassemble
on: workflow_dispatch
permissions: {contents: write, pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for b in assets/index-BeuvGpZ2.js assets/inter-BNVRAYFH.js assets/msdf-worker-BUaSHgMS.js assets/worker-BkRtSCqm.js; do cat $(ls "${b}.part"*|sort) > "$b"; done
          rm -f textures/webxr.png; for p in $(ls textures/webxr.png.part*|sort); do base64 -d "$p" >> textures/webxr.png; done
          find . -name "*.part*" -delete
          git config user.name bot; git config user.email bot@bot.com; git add -A; git commit -m x || true; git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: '.'}
      - uses: actions/deploy-pages@v4
