      (function() {
        var container = null;

          container = document.getElementById("scene-container");

          var lastX = 0, lastY = 0, dragging = false;
          function mouseEvent(type, touch) {
            var e = new MouseEvent(type, {
              clientX: touch.clientX, clientY: touch.clientY,
              bubbles: true, cancelable: true
            });
            (touch.target || container).dispatchEvent(e);
          }
          container.addEventListener("touchstart", function(e) {
            if (e.touches.length === 1) {
              dragging = true;
              lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
              mouseEvent("mousedown", e.touches[0]);
            }
          }, {passive: true});
          container.addEventListener("touchmove", function(e) {
            if (dragging && e.touches.length === 1) {
              e.preventDefault();
              mouseEvent("mousemove", e.touches[0]);
            }
          }, {passive: false});
          function end(e) {
            if (dragging) { dragging = false; mouseEvent("mouseup", (e.changedTouches||[])[0]||{}); }
          }
          container.addEventListener("touchend", end, {passive: true});
          container.addEventListener("touchcancel", end, {passive: true});
        }

          document.addEventListener("DOMContentLoaded", attach);

      })();
