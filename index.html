    <script>
      // iOS Safari: keep pointermove flowing during touch drag (prevents pointercancel scroll hijack).
      // Minimal and scoped: no event synthesis, no global preventDefault.
      (function() {
        function init() {
          var el = document.getElementById("scene-container");
          if (!el) { setTimeout(init, 300); return; }
          var activePointerId = null;
          el.addEventListener("pointerdown", function(e) {
            if (e.pointerType === "touch") {
              activePointerId = e.pointerId;
              try { el.setPointerCapture(e.pointerId); } catch (_) {}
            }
          });
          // Mount-time, non-passive backstop for iOS touch-action bugs.
          el.addEventListener("touchmove", function(e) {
            if (activePointerId !== null) e.preventDefault();
          }, { passive: false });
          function end(e) { if (e.pointerId === activePointerId) activePointerId = null; }
          el.addEventListener("pointerup", end);
          el.addEventListener("pointercancel", end);
        }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
        else init();
      })();
    </script>
