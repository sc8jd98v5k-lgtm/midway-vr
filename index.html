<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Midway VR</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; }
      #scene-container, #scene-container canvas { touch-action: none; }
      #errors { position: fixed; top: 0; left: 0; right: 0; background: rgba(255,0,0,0.9); color: white; font-family: monospace; font-size: 12px; padding: 10px; z-index: 9999; max-height: 50vh; overflow: auto; white-space: pre-wrap; }
    </style>
    <script>
      window.__errors = [];
      window.addEventListener('error', function(e) {
        window.__errors.push('ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
        var d = document.getElementById('errors');
        if (d) d.textContent = window.__errors.join('\n');
      });
      window.addEventListener('unhandledrejection', function(e) {
        window.__errors.push('REJECTION: ' + (e.reason && e.reason.message || e.reason));
        var d = document.getElementById('errors');
        if (d) d.textContent = window.__errors.join('\n');
      });
    </script>
    <script type="module" crossorigin src="./assets/index-YOV_Rshn.js"></script>
  </head>
  <body>
    <div id="errors">Loading... (errors will appear here)</div>
    <div id="scene-container"></div>
  </body>
</html>
